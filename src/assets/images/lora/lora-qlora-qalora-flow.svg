<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LoRA、QLoRA 与 QA-LoRA 流程对比</title>
  <desc id="desc">LoRA 在浮点权重上增加低秩更新，QLoRA 在量化权重上增加普通 LoRA，QA-LoRA 先按输入 group 池化再使用分组低秩更新并写回 qzeros。</desc>
  <style>
    .panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 24px sans-serif;fill:#172033}.label{font:600 16px sans-serif;fill:#172033}.small{font:14px sans-serif;fill:#526174}.box{stroke:#26364a;stroke-width:2;rx:10}.base{fill:#f7d98b}.adapter{fill:#b9dca7}.result{fill:#c8d9f5}.arrow{stroke:#53657a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.group{fill:#f4b5a4;stroke:#a94f40;stroke-width:1.5;stroke-dasharray:5 4}.code{font:15px monospace;fill:#26364a}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#53657a"/></marker></defs>
  <rect x="20" y="20" width="360" height="380" class="panel"/>
  <rect x="420" y="20" width="360" height="380" class="panel"/>
  <rect x="820" y="20" width="360" height="380" class="panel"/>
  <text x="200" y="58" text-anchor="middle" class="title">LoRA</text>
  <text x="600" y="58" text-anchor="middle" class="title">QLoRA</text>
  <text x="1000" y="58" text-anchor="middle" class="title">QA-LoRA</text>
  <rect x="60" y="100" width="130" height="70" class="box base"/><text x="125" y="142" text-anchor="middle" class="label">W FP16</text>
  <rect x="235" y="100" width="90" height="32" class="box adapter"/><text x="280" y="122" text-anchor="middle" class="label">A × B</text>
  <path d="M190 135 H230" class="arrow"/><path d="M280 132 V205" class="arrow"/>
  <rect x="155" y="205" width="150" height="60" class="box result"/><text x="230" y="241" text-anchor="middle" class="label">W + ΔW</text>
  <text x="50" y="320" class="code">y = xW + xAB</text><text x="50" y="350" class="small">训练：更新 A、B</text><text x="50" y="375" class="small">部署：可合并到 FP 权重</text>
  <rect x="460" y="100" width="130" height="70" class="box base"/><text x="525" y="142" text-anchor="middle" class="label">W4 / NF4</text>
  <rect x="635" y="100" width="90" height="32" class="box adapter"/><text x="680" y="122" text-anchor="middle" class="label">A × B</text>
  <path d="M590 135 H630" class="arrow"/><path d="M680 132 V205" class="arrow"/>
  <rect x="555" y="205" width="150" height="60" class="box result"/><text x="630" y="241" text-anchor="middle" class="label">dequant(W4)+ΔW</text>
  <text x="450" y="320" class="code">y = xW4 + xAB</text><text x="450" y="350" class="small">W4 冻结，训练 A、B</text><text x="450" y="375" class="small">部署：通常保留 adapter</text>
  <rect x="860" y="100" width="120" height="70" class="box base"/><text x="920" y="142" text-anchor="middle" class="label">W4</text>
  <rect x="1010" y="100" width="120" height="32" class="box adapter"/><text x="1070" y="122" text-anchor="middle" class="label">A × B</text>
  <rect x="850" y="190" width="55" height="55" class="group"/><rect x="910" y="190" width="55" height="55" class="group"/><rect x="970" y="190" width="55" height="55" class="group"/><text x="938" y="278" text-anchor="middle" class="small">输入按 group 平均池化</text>
  <path d="M920 170 V185" class="arrow"/><path d="M1070 132 V165 H938 V185" class="arrow"/>
  <path d="M938 285 V315" class="arrow"/><rect x="870" y="315" width="140" height="48" class="box result"/><text x="940" y="345" text-anchor="middle" class="label">修改 qzeros</text>
  <text x="1030" y="205" class="code">A: group-specific</text><text x="1030" y="230" class="code">B: shared</text><text x="1030" y="255" class="small">同一 group 的多列</text><text x="1030" y="276" class="small">共享同一个更新向量</text>
</svg>
