<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">均匀量化和向量量化对比</title>
  <desc id="desc">比较两种量化方法对四个权重的存储方式、反量化方式和部署特点。</desc>
  <rect width="1200" height="570" fill="#f8fafc"/>
  <style>
    .title{font-family:'Noto Sans CJK SC',Arial,sans-serif;font-size:26px;font-weight:700;fill:#172033}.head{font-family:'Noto Sans CJK SC',Arial,sans-serif;font-size:20px;font-weight:700;fill:#fff}.cell{font-family:'Noto Sans CJK SC',Arial,sans-serif;font-size:16px;fill:#334155}.mono{font-family:'Noto Sans Mono CJK SC',monospace;font-size:15px;font-weight:600;fill:#172033}.left{fill:#0f766e}.right{fill:#c2410c}.grid{stroke:#cbd5e1;stroke-width:2}.note{font-family:'Noto Sans CJK SC',Arial,sans-serif;font-size:16px;fill:#475569}
  </style>
  <text x="56" y="52" class="title">Uniform vs. vector quantization</text>
  <rect x="54" y="90" width="530" height="58" rx="10" class="left"/>
  <text x="80" y="127" class="head">Uniform</text>
  <rect x="616" y="90" width="530" height="58" rx="10" class="right"/>
  <text x="642" y="127" class="head">Vector</text>
  <line x1="54" y1="148" x2="1146" y2="148" class="grid"/>
  <line x1="584" y1="90" x2="584" y2="510" class="grid"/>
  <text x="80" y="188" class="cell">Quantize</text><text x="310" y="188" class="mono">Each weight</text>
  <text x="642" y="188" class="cell">Quantize</text><text x="872" y="188" class="mono">Weight block</text>
  <line x1="54" y1="210" x2="1146" y2="210" class="grid"/>
  <text x="80" y="250" class="cell">Stored</text><text x="310" y="250" class="mono">Code + scale/offset</text>
  <text x="642" y="250" class="cell">Stored</text><text x="872" y="250" class="mono">Index + codebook</text>
  <line x1="54" y1="272" x2="1146" y2="272" class="grid"/>
  <text x="80" y="312" class="cell">Dequant</text><text x="310" y="312" class="mono">q * scale + offset</text>
  <text x="642" y="312" class="cell">Dequant</text><text x="872" y="312" class="mono">codebook[index]</text>
  <line x1="54" y1="334" x2="1146" y2="334" class="grid"/>
  <text x="80" y="374" class="cell">Pros</text><text x="180" y="374" class="cell">Simple, hardware-friendly</text>
  <text x="642" y="374" class="cell">Pros</text><text x="742" y="374" class="cell">Better low-bit fidelity</text>
  <line x1="54" y1="396" x2="1146" y2="396" class="grid"/>
  <text x="80" y="436" class="cell">Cost</text><text x="180" y="436" class="cell">More error at very low bit</text>
  <text x="642" y="436" class="cell">Cost</text><text x="742" y="436" class="cell">Lookup and kernels are complex</text>
  <line x1="54" y1="458" x2="1146" y2="458" class="grid"/>
  <text x="56" y="520" class="note">Uniform favors deployment; vector favors low-bit reconstruction.</text>
</svg>
