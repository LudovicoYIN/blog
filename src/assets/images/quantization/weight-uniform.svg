<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">权重均匀量化示意图</title>
  <desc id="desc">浮点权重通过 scale 和 offset 映射到等间距的整数刻度，再反量化回近似权重。</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <style>
    .title{font:700 26px sans-serif;fill:#172033}.label{font:600 18px sans-serif;fill:#334155}.small{font:16px sans-serif;fill:#475569}.num{font:600 15px monospace;fill:#172033}.line{stroke:#334155;stroke-width:3}.accent{stroke:#0f766e;stroke-width:4}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.code{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.arrow{fill:#0f766e}
  </style>
  <text x="56" y="54" class="title">均匀量化：每个权重使用同一把“等间距的尺子”</text>
  <text x="56" y="92" class="small">以 4 bit 为例，整数码只有 0 到 15；scale 决定格子间距，offset 决定尺子的位置。</text>
  <text x="70" y="148" class="label">浮点权重</text>
  <rect x="54" y="170" width="1090" height="82" rx="12" class="box"/>
  <text x="82" y="220" class="num">[  -0.80    -0.42     0.10     0.70  ]</text>
  <path d="M 570 252 L 570 302" class="accent"/>
  <path d="M 570 302 l -8 -14 h 16 z" class="arrow"/>
  <text x="607" y="286" class="small">q = round((w - offset) / scale)</text>
  <text x="70" y="344" class="label">整数码（存储）</text>
  <rect x="54" y="366" width="1090" height="82" rx="12" class="code"/>
  <text x="82" y="416" class="num">[     0        4        9       15   ]</text>
  <text x="82" y="482" class="small">反量化：w_hat = q * scale + offset。每个元素独立查自己的整数格子。</text>
</svg>
